name: Node CI
permissions:
  contents: write
on:
  - push
  - pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NAME: dword
    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x
          - 26.x
          - ">= 27.0.0-alpha.0 <= 27.x"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Redrun
        run: bun i redrun madrun -g --no-save
      - name: Install
        run: bun i --no-save
      - name: Init Madrun
        run: madrun --init
      - name: Lint
        run: redrun fix:lint
      - name: Typos
        uses: coderaiser/typos.ai@v2.0.0
      - name: Commit fixes
        uses: EndBug/add-and-commit@v10
        continue-on-error: true
        with:
          message: "chore: ${{ env.NAME }}: actions: lint ☘️"
      - name: Coverage
        run: redrun coverage
